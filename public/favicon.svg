<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="散页">
  <!--
    散页 · 站点图标（浏览器标签页用）
    从根目录那张原图（LooseLeaf.png：旧纸 + 干花）**简化**而来 ——
    保留三个识别要素：斜置的旧纸、折角、纸面上的干花枝；
    去掉照片卡与纹理细节，让它在 16px 的标签页上也读得出来。

    PWA 安装图标 / Apple Touch 图标仍用原图（public/icons/*.png），不在这里替换。
  -->
  <title>散页</title>

  <!-- 身后的照片卡（深色纸条） -->
  <path d="M3.4 7.1 L9.2 5.6 L10.1 19.4 L4.3 20.8 Z" fill="#2F2A22"/>

  <!-- 旧纸本体（微微倾斜） -->
  <path d="M6.6 3.1 L18.1 5.3 L18.7 20.6 L7.5 21 Z" fill="#E9E0C9"/>

  <!-- 折角 -->
  <path d="M18.1 5.3 L14.6 7.6 L18.2 8.1 Z" fill="#D6C9AC"/>

  <!-- 干花枝：茎 -->
  <path d="M12.2 18.9 C12.7 15.4 13.1 11.9 13.5 8.5"
        fill="none" stroke="#6E6350" stroke-width="0.85" stroke-linecap="round"/>

  <!-- 干花枝：小叶 -->
  <path d="M12.8 15.2 C11.9 14.8 11.3 14.1 11.1 13.2 C12.1 13.4 12.7 14.1 12.8 15.2 Z" fill="#7E7358"/>
  <path d="M13.1 12.6 C14.0 12.3 14.6 11.6 14.8 10.7 C13.8 10.9 13.2 11.6 13.1 12.6 Z" fill="#7E7358"/>

  <!-- 干花枝：花头（一簇小花） -->
  <g fill="#C8B189">
    <circle cx="13.5" cy="8.3" r="1.15"/>
    <circle cx="11.9" cy="9.3" r="0.85"/>
    <circle cx="15.1" cy="9.6" r="0.8"/>
    <circle cx="12.9" cy="11.1" r="0.7"/>
  </g>
</svg>
